<div class="login-page">

  <!-- Fondo decorativo -->
  <div class="background-shape shape-left"></div>
  <div class="background-shape shape-right"></div>
  <div class="background-wave"></div>


  <!-- Encabezado -->
  <header class="top-header">

    <div class="brand">

      <div class="brand-icon">

        <svg viewBox="0 0 64 64" fill="none">

          <path
            d="M10 25h44l-5-12H15L10 25Z"
            fill="white"
          />

          <path
            d="M12 27h40v7c0 3-2 5-5 5-2 0-4-1-5-3-1 2-3 3-5 3s-4-1-5-3c-1 2-3 3-5 3s-4-1-5-3c-1 2-3 3-5 3-3 0-5-2-5-5v-7Z"
            fill="white"
          />

          <path
            d="M18 39v13h28V39"
            stroke="white"
            stroke-width="4"
          />

          <path
            d="M26 52V43h12v9"
            stroke="white"
            stroke-width="4"
          />

        </svg>

      </div>


      <div>

        <div class="brand-name">
          Faltantes
        </div>

        <div class="brand-subtitle">
          Sistema de Inventario
        </div>

      </div>

    </div>


    <div class="header-message">

      Tu negocio,<br>

      <strong>
        siempre bajo control
      </strong>

      <div class="header-line"></div>

    </div>

  </header>



  <!-- Área principal -->

  <main class="main-content">

    <div class="login-card">


      <!-- Logo -->

      <div class="login-logo">

        <svg viewBox="0 0 64 64" fill="none">

          <path
            d="M10 25h44l-5-12H15L10 25Z"
            fill="white"
          />

          <path
            d="M12 27h40v7c0 3-2 5-5 5-2 0-4-1-5-3-1 2-3 3-5 3s-4-1-5-3c-1 2-3 3-5 3s-4-1-5-3c-1 2-3 3-5 3-3 0-5-2-5-5v-7Z"
            fill="white"
          />

          <path
            d="M18 39v13h28V39"
            stroke="white"
            stroke-width="4"
          />

          <path
            d="M26 52V43h12v9"
            stroke="white"
            stroke-width="4"
          />

        </svg>

      </div>


      <h1>
        Faltantes
      </h1>


      <div class="system-name">

        S I S T E M A&nbsp;&nbsp;
        D E&nbsp;&nbsp;
        I N V E N T A R I O

      </div>


      <h2>
        Iniciar sesión
      </h2>


      <p class="login-description">
        Ingresa tus datos para continuar
      </p>



      <!-- =========================================
           FORMULARIO
      ========================================== -->

      <form
        (ngSubmit)="iniciarSesion()"
        #loginForm="ngForm">


        <!-- =========================================
             USUARIO
        ========================================== -->

        <div class="form-group">

          <label for="username">
            Usuario
          </label>


          <div class="input-container">

            <!-- Icono usuario -->

            <svg
              class="input-icon"
              viewBox="0 0 24 24"
              fill="none">

              <circle
                cx="12"
                cy="7"
                r="4"
                stroke="currentColor"
                stroke-width="2"
              />

              <path
                d="M4 21c0-4 3.5-7 8-7s8 3 8 7"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />

            </svg>


            <!-- Campo usuario -->

            <input
              type="text"
              id="username"
              name="username"
              [(ngModel)]="username"
              placeholder="Usuario"
              autocomplete="username"
            />

          </div>

        </div>



        <!-- =========================================
             CONTRASEÑA
        ========================================== -->

        <div class="form-group">

          <label for="password">
            Contraseña
          </label>


          <div class="input-container">


            <!-- Icono candado -->

            <svg
              class="input-icon"
              viewBox="0 0 24 24"
              fill="none">

              <rect
                x="5"
                y="10"
                width="14"
                height="11"
                rx="2"
                stroke="currentColor"
                stroke-width="2"
              />

              <path
                d="M8 10V7a4 4 0 0 1 8 0v3"
                stroke="currentColor"
                stroke-width="2"
              />

            </svg>



            <!-- Campo contraseña -->

            <input
              [type]="mostrarPassword ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="password"
              placeholder="Contraseña"
              autocomplete="current-password"
            />



            <!-- Mostrar / ocultar contraseña -->

            <button
              type="button"
              class="password-button"
              (click)="mostrarPassword = !mostrarPassword"
              aria-label="Mostrar contraseña">


              <!-- Ojo cerrado -->

              <svg
                *ngIf="!mostrarPassword"
                viewBox="0 0 24 24"
                fill="none">

                <path
                  d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                  stroke="currentColor"
                  stroke-width="2"
                />

                <circle
                  cx="12"
                  cy="12"
                  r="3"
                  stroke="currentColor"
                  stroke-width="2"
                />

              </svg>



              <!-- Ojo abierto -->

              <svg
                *ngIf="mostrarPassword"
                viewBox="0 0 24 24"
                fill="none">

                <path
                  d="M3 3l18 18"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />

                <path
                  d="M10.5 5.2A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3.2 4.2"
                  stroke="currentColor"
                  stroke-width="2"
                />

                <path
                  d="M6.2 6.2C3.4 8.2 2 12 2 12s3.5 7 10 7c1.4 0 2.7-.3 3.8-.8"
                  stroke="currentColor"
                  stroke-width="2"
                />

              </svg>

            </button>

          </div>

        </div>



        <!-- =========================================
             RECUPERAR CONTRASEÑA
        ========================================== -->

        <div class="forgot-container">

          <a
            href="#"
            (click)="$event.preventDefault()">

            ¿Olvidaste tu contraseña?

          </a>

        </div>



        <!-- =========================================
             MENSAJE DE ERROR
        ========================================== -->

        <div
          class="login-error"
          *ngIf="error">

          {{ error }}

        </div>



        <!-- =========================================
             BOTÓN LOGIN
        ========================================== -->

        <button
          type="submit"
          class="login-button"
          [disabled]="cargando">


          <span>

            {{ cargando ? 'Validando...' : 'Iniciar sesión' }}

          </span>


          <span
            class="arrow"
            *ngIf="!cargando">

            →

          </span>

        </button>


      </form>

    </div>

  </main>



  <!-- =========================================
       PARTE INFERIOR
  ========================================== -->

  <div class="bottom-info">

    <div class="dots">

      <span class="active"></span>

      <span></span>

      <span></span>

    </div>


    <div class="version">

      v1.0.0

    </div>

  </div>

</div>
